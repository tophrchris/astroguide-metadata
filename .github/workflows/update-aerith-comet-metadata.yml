name: Update Aerith comet metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-aerith-comet-metadata
  cancel-in-progress: false

jobs:
  update:
    name: Refresh Aerith comet detail package
    runs-on: ubuntu-latest
    steps:
      - name: Check out metadata repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Aerith comet metadata
        run: |
          python scripts/update_aerith_comet_metadata.py \
            --image-limit 50 \
            --fetch-delay-seconds 0.5

      - name: Validate generated metadata
        run: |
          python -m unittest \
            tests/test_aerith_comet_source.py \
            tests/test_comet_detail_metadata_package.py
          python - <<'PY'
          import json
          from pathlib import Path

          for path in [
              Path("sources/comets/aerith_current_comets_v1.json"),
              Path("v1/packages/comet-details/comet_detail_metadata_v1.json"),
              Path("v1/channels/stable/manifest.json"),
          ]:
              json.loads(path.read_text(encoding="utf-8"))

          index = json.loads(Path("v1/packages/comet-details/comet_detail_metadata_v1.json").read_text(encoding="utf-8"))
          for comet in index.get("comets", []):
              shard_path = Path(comet["path"])
              json.loads(shard_path.read_text(encoding="utf-8"))
          PY

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/aerith-comet-metadata
        run: |
          if git diff --quiet; then
            echo "No Aerith metadata changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH_NAME"
          git add \
            sources/comets/aerith_current_comets_v1.json \
            v1/packages/comet-details \
            v1/assets/comets/aerith \
            v1/channels/stable/manifest.json
          git commit -m "Update Aerith comet metadata"
          git push --force-with-lease origin "$BRANCH_NAME"

          body="$(mktemp)"
          cat > "$body" <<'BODY'
          Automated weekly Aerith comet metadata refresh.

          This PR was generated by the scheduled metadata workflow. It refreshes:

          - `sources/comets/aerith_current_comets_v1.json`
          - `v1/packages/comet-details/`
          - `v1/assets/comets/aerith/`
          - `v1/channels/stable/manifest.json`

          The workflow validates Aerith source parsing, comet detail metadata decoding, JSON parseability, and all referenced comet-detail shards.

          Aerith usage is covered by the documented permission from Seiichi Yoshida, with attribution and relevant Aerith detail-page links preserved in the metadata package.
          BODY

          if gh pr view "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$BRANCH_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Update Aerith comet metadata" \
              --body-file "$body"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Update Aerith comet metadata" \
              --body-file "$body"
          fi
