name: Update TNS transient review queue

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: Queue date in YYYY-MM-DD (defaults to previous UTC date)
        required: false
        type: string
      lookback_days:
        description: Number of staged daily deltas to fetch (1-14)
        required: false
        default: "7"
        type: string
      max_candidates:
        description: Maximum review candidates to publish in the PR (0 for unlimited)
        required: false
        default: "5"
        type: string
      ios_ref:
        description: DSOPlanneriOS ref to use for catalog input
        required: false
        default: main
        type: string
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-tns-transient-review
  cancel-in-progress: false

jobs:
  update:
    name: Refresh TNS review queue
    runs-on: ubuntu-latest
    steps:
      - name: Check out metadata repository
        uses: actions/checkout@v4
        with:
          path: astroguide-metadata
          fetch-depth: 0

      - name: Continue the existing review branch when present
        working-directory: astroguide-metadata
        env:
          BRANCH_NAME: automation/tns-transient-review
        run: |
          if git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"; then
            git switch -C "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            git switch -C "$BRANCH_NAME" origin/main
          fi

      - name: Require private catalog deploy key and TNS marker
        env:
          DSOPLANNERIOS_READ_SSH_KEY: ${{ secrets.DSOPLANNERIOS_READ_SSH_KEY }}
          TNS_USER_AGENT: ${{ secrets.TNS_USER_AGENT }}
        run: |
          if [[ -z "$DSOPLANNERIOS_READ_SSH_KEY" ]]; then
            echo "Repository secret DSOPLANNERIOS_READ_SSH_KEY is required." >&2
            exit 2
          fi
          if [[ "$TNS_USER_AGENT" != tns_marker\{* ]]; then
            echo "Repository secret TNS_USER_AGENT must contain the approved tns_marker JSON user agent." >&2
            exit 2
          fi

      - name: Check out AstroGuide iOS catalog source
        uses: actions/checkout@v4
        with:
          repository: tophrchris/DSOPlanneriOS
          path: DSOPlanneriOS
          ref: ${{ inputs.ios_ref || 'main' }}
          ssh-key: ${{ secrets.DSOPLANNERIOS_READ_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Tailscale exit-node configuration
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
          TS_EXPECTED_PUBLIC_IP: ${{ secrets.TS_EXPECTED_PUBLIC_IP }}
        run: |
          if [[ -z "$TS_OAUTH_CLIENT_ID" ]]; then
            echo "Repository secret TS_OAUTH_CLIENT_ID is required." >&2
            exit 2
          fi
          if [[ -z "$TS_OAUTH_SECRET" ]]; then
            echo "Repository secret TS_OAUTH_SECRET is required." >&2
            exit 2
          fi
          if [[ -z "$TS_EXIT_NODE" ]]; then
            echo "Repository secret TS_EXIT_NODE is required." >&2
            exit 2
          fi
          if [[ -z "$TS_EXPECTED_PUBLIC_IP" ]]; then
            echo "Repository secret TS_EXPECTED_PUBLIC_IP is required so the workflow can fail closed before calling TNS." >&2
            exit 2
          fi

      - name: Route TNS fetches through Tailscale exit node
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          hostname: astroguide-tns-${{ github.run_id }}-${{ github.run_attempt }}
          args: --exit-node=${{ secrets.TS_EXIT_NODE }}
          ping: ${{ secrets.TS_EXIT_NODE }}
          version: latest

      - name: Verify TNS egress route
        env:
          TS_EXPECTED_PUBLIC_IP: ${{ secrets.TS_EXPECTED_PUBLIC_IP }}
        run: |
          set -euo pipefail
          tailscale status >/dev/null
          public_ip="$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)"
          echo "::add-mask::${public_ip}"
          echo "::add-mask::${TS_EXPECTED_PUBLIC_IP}"
          if [[ "$public_ip" != "$TS_EXPECTED_PUBLIC_IP" ]]; then
            echo "Tailscale exit-node public IP did not match TS_EXPECTED_PUBLIC_IP; refusing to call TNS." >&2
            exit 2
          fi
          echo "Tailscale exit-node public IP matches the expected masked IP."

      - name: Build review queue from staged TNS deltas
        working-directory: astroguide-metadata
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
          MAX_CANDIDATES: ${{ inputs.max_candidates || '5' }}
          TNS_USER_AGENT: ${{ secrets.TNS_USER_AGENT }}
          TNS_API_KEY: ${{ secrets.TNS_API_KEY }}
        run: |
          as_of="${REQUESTED_AS_OF:-$(date -u -d 'yesterday' +%F)}"
          echo "REVIEW_AS_OF=$as_of" >> "$GITHUB_ENV"
          if [[ -z "$TNS_API_KEY" ]]; then
            echo "::warning::TNS_API_KEY is not configured; generating staged-feed and AstroGuide catalog pre-enrichment only."
          fi
          python scripts/build_tns_transient_review_queue.py \
            --catalog ../DSOPlanneriOS/App/Resources/Catalog/catalog.sqlite \
            --as-of "$as_of" \
            --fetch-days "$LOOKBACK_DAYS" \
            --max-opportunities "$MAX_CANDIDATES" \
            --target-image-package v1/packages/target-images/target_image_assets_v1.json \
            --skip-unchanged
          review_json="outputs/transients/review/transient-review-${as_of}.json"
          if [[ ! -f "$review_json" ]]; then
            review_json="$(find outputs/transients/review -name 'transient-review-*.json' -type f | sort | tail -1)"
          fi
          if [[ -z "$review_json" || ! -f "$review_json" ]]; then
            echo "No canonical TNS review artifact is available." >&2
            exit 2
          fi
          review_markdown="${review_json%.json}.md"
          if [[ ! -f "$review_markdown" ]]; then
            echo "Canonical TNS review Markdown is missing for $review_json." >&2
            exit 2
          fi
          echo "REVIEW_JSON=$review_json" >> "$GITHUB_ENV"
          echo "REVIEW_MARKDOWN=$review_markdown" >> "$GITHUB_ENV"

      - name: Validate generated review artifacts
        working-directory: astroguide-metadata
        run: |
          python -m unittest tests/test_tns_transient_review_queue.py
          python scripts/build_tns_transient_review_queue.py \
            --catalog ../DSOPlanneriOS/App/Resources/Catalog/catalog.sqlite \
            --validate-only "$REVIEW_JSON"

      - name: Open or update review pull request
        working-directory: astroguide-metadata
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/tns-transient-review
          IOS_REF: ${{ inputs.ios_ref || 'main' }}
        run: |
          git add outputs/transients/review
          has_changes=false
          if ! git diff --cached --quiet -- outputs/transients/review; then
            has_changes=true
          fi

          review_markdown="$REVIEW_MARKDOWN"
          if [[ ! -f "$review_markdown" ]]; then
            echo "No generated TNS review Markdown was found for ${REVIEW_AS_OF}." >&2
            exit 2
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$has_changes" == true ]]; then
            git commit -m "Update TNS transient review queue"
            git push --force-with-lease origin "$BRANCH_NAME"
          fi

          body="$(mktemp)"
          cat > "$body" <<BODY
          > **Review-only invariant:** This pull request contains decision-support artifacts for human review. A PR approval is editorial sign-off on the current head and review-evidence hash; the automation itself does **not** publish candidates to the stable manifest or app, mutate per-candidate decisions, change iOS UI, or send notifications.

          Generated by the daily TNS review automation from staged deltas and the AstroGuide catalog at \`tophrchris/DSOPlanneriOS@$IOS_REF\`. Scheduled runs include at most five candidates by default; manual dispatch can override the cap.

          BODY
          review_bytes="$(wc -c < "$review_markdown")"
          if (( review_bytes <= 50000 )); then
            cat "$review_markdown" >> "$body"
          else
            printf '\nThe full dossier is available in `%s` in this pull request; it is too large to inline safely in the PR body.\n' "$review_markdown" >> "$body"
          fi

          open_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$open_pr" ]]; then
            gh pr edit "$open_pr" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Update TNS transient opportunity review queue" \
              --body-file "$body"
            head_sha="$(git rev-parse HEAD)"
            stale_review_ids="$(gh api \
              "repos/$GITHUB_REPOSITORY/pulls/$open_pr/reviews" \
              --paginate \
              --jq ".[] | select(.state == \"APPROVED\" and .commit_id != \"$head_sha\") | .id")"
            while read -r review_id; do
              [[ -z "$review_id" ]] && continue
              gh api \
                --method PUT \
                "repos/$GITHUB_REPOSITORY/pulls/$open_pr/reviews/$review_id/dismissals" \
                -f message="The generated evidence or review set changed; please review the current head and evidence hash."
            done <<< "$stale_review_ids"
          elif [[ "$has_changes" == true ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Update TNS transient opportunity review queue" \
              --body-file "$body"
          else
            echo "No material TNS review-queue changes and no open review PR to repair."
          fi
