name: Update close encounter metadata

on:
  workflow_dispatch:
    inputs:
      ios_ref:
        description: DSOPlanneriOS ref to use for catalog input
        required: false
        default: main
        type: string
  schedule:
    - cron: "37 12 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-close-encounter-metadata
  cancel-in-progress: false

jobs:
  update:
    name: Refresh close-encounter packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out metadata repository
        uses: actions/checkout@v4
        with:
          path: astroguide-metadata
          fetch-depth: 0

      - name: Require private catalog deploy key
        env:
          DSOPLANNERIOS_READ_SSH_KEY: ${{ secrets.DSOPLANNERIOS_READ_SSH_KEY }}
        run: |
          if [[ -z "$DSOPLANNERIOS_READ_SSH_KEY" ]]; then
            echo "Repository secret DSOPLANNERIOS_READ_SSH_KEY is required." >&2
            exit 2
          fi

      - name: Check out AstroGuide iOS catalog source
        uses: actions/checkout@v4
        with:
          repository: tophrchris/DSOPlanneriOS
          path: DSOPlanneriOS
          ref: ${{ inputs.ios_ref || 'main' }}
          ssh-key: ${{ secrets.DSOPLANNERIOS_READ_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ephemeris dependencies
        working-directory: astroguide-metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-lunar-events.txt

      - name: Generate close-encounter metadata
        working-directory: astroguide-metadata
        run: |
          python scripts/build_lunar_event_package.py --app-repo ../DSOPlanneriOS
          python scripts/build_planet_target_close_encounter_package.py --app-repo ../DSOPlanneriOS
          python scripts/build_comet_close_encounter_package.py --app-repo ../DSOPlanneriOS

      - name: Validate generated metadata
        working-directory: astroguide-metadata
        run: |
          python scripts/build_lunar_event_package.py --validate-only
          python scripts/build_planet_target_close_encounter_package.py --validate-only
          python scripts/build_comet_close_encounter_package.py --validate-only
          python -m unittest \
            tests/test_lunar_event_identity.py \
            tests/test_planet_target_close_encounter_package.py \
            tests/test_comet_close_encounter_package.py
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("v1/channels/stable/manifest.json"),
              *Path("v1/packages/lunar-events").rglob("*.json"),
              *Path("v1/packages/planet-target-close-encounters").rglob("*.json"),
              *Path("v1/packages/comet-close-encounters").rglob("*.json"),
          ]
          for path in sorted(paths):
              json.loads(path.read_text(encoding="utf-8"))
          PY

      - name: Open or update pull request
        working-directory: astroguide-metadata
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/close-encounter-metadata
          IOS_REF: ${{ inputs.ios_ref || 'main' }}
        run: |
          if git diff --quiet; then
            echo "No close-encounter metadata changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH_NAME"
          git add \
            v1/packages/lunar-events \
            v1/packages/planet-target-close-encounters \
            v1/packages/comet-close-encounters \
            v1/channels/stable/manifest.json
          git commit -m "Update close encounter metadata"
          git push --force-with-lease origin "$BRANCH_NAME"

          body="$(mktemp)"
          cat > "$body" <<BODY
          Automated monthly close-encounter metadata refresh.

          This PR was generated by the scheduled metadata workflow using \`tophrchris/DSOPlanneriOS@$IOS_REF\` as the catalog input. It refreshes:

          - \`v1/packages/lunar-events/\` for Moon phases, eclipses, and lunar close encounters with DSOs, planets, and comets
          - \`v1/packages/planet-target-close-encounters/\` for major-planet close encounters with catalog DSOs
          - \`v1/packages/comet-close-encounters/\` for comet close encounters with catalog DSOs, the Moon, and major planets
          - \`v1/channels/stable/manifest.json\`

          The workflow validates each package with its generator's \`--validate-only\` mode, runs focused close-encounter tests, and JSON-parses every refreshed package index and monthly shard.

          This workflow does not harvest new comet inputs. It consumes the checked-in comet snapshot package that is current on \`main\`; review upstream comet snapshot changes separately before relying on new comet close encounters.
          BODY

          if gh pr view "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$BRANCH_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Update close encounter metadata" \
              --body-file "$body"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Update close encounter metadata" \
              --body-file "$body"
          fi
